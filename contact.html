<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - ChocoBerry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">🍓 ChocoBerry</a>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="products.html">Товары</a></li>
                <li><a href="contact.html" class="active">Контакты</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">Свяжитесь с нами для заказа</h2>
        <div class="contact-form">
            <form>
                <div class="form-group">
                    <label for="name">Ваше имя</label>
                    <input type="text" id="name" placeholder="Введите ваше имя...">
                </div>
                <div class="form-group">
                    <label for="email">Номер телефона</label>
                    <input type="text" id="email" placeholder="+998 () ___--__">
                </div>
                <div class="form-group">
                    <label for="message">Ваш комментарий или адрес доставки</label>
                    <textarea id="message" rows="5" placeholder="Какой товар вы хотите заказать и куда доставить?"></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Оформить заказ</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ChocoBerry Market. Все права защищены.</p>
    </footer>

</body>
</html>
